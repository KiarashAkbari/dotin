[source]
url = "https://data.cityofnewyork.us/resource/erm2-nwe9.json"
agency = "NYPD"
complaint_types = [
  "Noise - Residential",
  "Noise - Street/Sidewalk",
  "Noise - Commercial",
  "Noise - Vehicle",
  "Noise - Park",
  "Noise - House of Worship",
]
columns = [
  "unique_key", "created_date", "closed_date", "agency", "complaint_type",
  "descriptor", "status", "borough", "incident_zip", "community_board",
]
start_date = 2025-01-01
end_date = 2026-06-30
page_size = 50000
app_token_env = "SOCRATA_APP_TOKEN"
timezone = "America/New_York"

[http]
timeout_seconds = 120
max_retries = 5
backoff_base_seconds = 2.0
backoff_factor = 2.0
retry_statuses = [429, 500, 502, 503, 504]

[paths]
raw_dir = "data/raw"
curated_dir = "data/curated"
quarantine_dir = "data/quarantine"
manifest_path = "data/run_manifest.json"

[quality]
max_quarantine_ratio = 0.01
min_rows_for_threshold = 1000

[reference]
url = "https://data.cityofnewyork.us/resource/pri4-ifjk.json"
columns = ["modzcta", "label", "pop_est"]
limit = 500
path = "data/raw/reference/modzcta.json"

[database]
url = "postgresql+psycopg://kiarash@localhost:5432/olist_db"
password_env = "OLIST_DB_PASSWORD"
olist_csv_dir = "../stage-2-kiarash-akbari/data/raw/olist"
stage1_curated_dir = "data/curated"
batch_size = 5000
sql_migrations_dir = "../stage-2-kiarash-akbari/sql"