[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "tzdata",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
analysis = [
    "pandas",
    "matplotlib",
]

[project.scripts]
data-factory = "data_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"] 